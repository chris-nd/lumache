name: "Sphinx: Render docs"

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build HTML
        uses: ammaraskar/sphinx-action@master
        with:
          # On indique à Sphinx que le dossier source est 'docs/source'
          docs-folder: "docs/source"
          # Installe les dépendances listées dans docs/source/requirements.txt avant la compilation
          pre-build-command: "pip install -r docs/requirements.txt"
          build-command: "sphinx-build -b html . _build/html"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/source/_build/html/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/source/_build/html